[project]
name = "pdfrest"
version = "0.1.0"
description = "Python client library for interacting with the PDFRest API"
readme = "README.md"
authors = [
    {name = "Datalogics"},
]
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=3.7.0",
    "black>=24.8.0",
    "isort>=5.13.2",
    "ruff>=0.6.9",
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.2",
    "pip-audit>=2.7.3",
]

[tool.isort]
combine_as_imports = true
split_on_trailing_comma = true
profile = "black"
known_first_party = ["pdfrest"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
pretty = true
exclude = [
    '^\\.venv',
    '^build',
    '^dist',
]
files = "."
plugins = [
    "pydantic.mypy",
]
# Discover modules that were installed in the virtualenv
python_executable = ".venv/bin/python"
fixed_format_cache = true

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
extend-include = ["*.ipynb"]
target-version = "py39"

[tool.ruff.lint]
extend-select = [
    "I",
    "B",
    "C4",
    "PGH",
    "RUF",
    "W",
    "YTT",
    "UP",
    "N",
    "PT",
    "C90",
    "FURB",
    "S",
    "BLE",
    "EM",
    "G",
    "RET",
    "DTZ",
    "SIM",
    "ARG",
    "PTH",
    "RSE",
    "TRY",
    "COM818",
]
fixable = ["ALL"]
ignore = []
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pdfrest"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "FBT"]

[tool.tomlsort]
sort_first = ["project", "build-system"]
spaces_before_inline_comment = 2
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
